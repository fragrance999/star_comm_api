services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: starcomm-postgres
    environment:
      POSTGRES_USER: starcomm
      POSTGRES_PASSWORD: starcomm
      POSTGRES_DB: starcomm
    ports:
      - "5432:5432"
    volumes:
      - starcomm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starcomm -d starcomm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: starcomm-redis
    ports:
      - "6379:6379"
    volumes:
      - starcomm_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  starcomm_postgres_data:
  starcomm_redis_data:
